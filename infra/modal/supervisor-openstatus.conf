[program:libsql]
command=/usr/local/bin/sqld
directory=/var/lib/sqld
environment=SQLD_NODE="primary",SQLD_DB_PATH="/var/lib/sqld/data",SQLD_HTTP_LISTEN_ADDR="127.0.0.1:8080"
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:workflows]
command=/usr/local/bin/deno run -A --sloppy-imports /opt/openstatus/apps/workflows/src/serve.ts
directory=/opt/openstatus/apps/workflows
environment=PORT="3000"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/local/bin/deno run -A --sloppy-imports /opt/openstatus/apps/server/src/serve.ts
directory=/opt/openstatus/apps/server
environment=PORT="3001"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:private-location]
command=/opt/runtime/private-location
environment=PORT="8081"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:checker]
command=/opt/runtime/checker
environment=PORT="8082"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:private-probe]
command=/bin/sh -c 'if [ -n "$OPENSTATUS_KEY" ]; then exec /opt/runtime/private-probe; else exec sleep infinity; fi'
environment=PORT="8083"
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=/usr/local/bin/node server.js
directory=/opt/runtime/dashboard/apps/dashboard
environment=PORT="3002",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:status-page]
