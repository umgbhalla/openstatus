map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # 8100: tinybird's internal tokens service already owns 8000 in this base.
    listen 8100 default_server;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    # Modal's edge forwards Host as an internal IP; Next Server Actions + next-auth
    # compare Origin vs X-Forwarded-Host and abort on mismatch — pin the public host.
    # __PUBLIC_HOST__ is substituted at container boot (Gateway.start) from
    # OPENSTATUS_PUBLIC_URL, so this config is portable across workspaces (umgbhalla,
    # zonko, ...) instead of being hardwired to one deploy's hostname.
    proxy_set_header Host __PUBLIC_HOST__;
    proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Public status-page app (basePath /status). Must NOT swallow the
    # dashboard's /status-pages* routes — match the /status prefix only when
    # followed by "/" or end-of-path, so /status-pages stays on the dashboard.
    location = /status {
        proxy_pass http://127.0.0.1:3003;
    }

    location ^~ /status/ {
        proxy_pass http://127.0.0.1:3003;
    }

    location ^~ /openstatus-api/ {
        rewrite ^/openstatus-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /internal/workflows/ {
        rewrite ^/internal/workflows/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
